version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: healthy_flow_db_container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: healthy_flow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: healthy_flow_web_container
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=healthy_flow_db
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres_secure_pass
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: